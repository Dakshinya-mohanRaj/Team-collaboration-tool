<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TASKFLOW — Projects" />
  <title>Projects · TASKFLOW</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="view">
    <div class="content-head">
      <div>
        <h1 class="content-head__title">Projects</h1>
        <p class="content-head__sub">Manage your team's projects and progress.</p>
      </div>
      <button type="button" class="btn btn--primary" id="new-project-btn">+ Create Project</button>
    </div>

    <div class="filter-bar" role="search" aria-label="Project filters">
      <input
        type="search"
        id="project-search"
        class="input"
        style="flex:1;min-width:200px"
        placeholder="Search projects..."
        aria-label="Search projects"
      />
    </div>

    <div class="team-grid" id="project-grid"></div>

    <div class="empty-state" id="project-empty" hidden>
      <div class="empty-state__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      </div>
      <h3>No projects found</h3>
      <p>Create your first project to start collaborating.</p>
      <button type="button" class="btn btn--primary mt-3" id="empty-new-project">+ Create Project</button>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/projects.js"></script>
</body>
</html>
