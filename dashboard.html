<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TASKFLOW — Dashboard" />
  <title>Dashboard · TASKFLOW</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="view">
    <div class="content-head">
      <div>
        <h1 class="content-head__title">Dashboard</h1>
        <p class="content-head__sub" id="dash-welcome">Welcome back!</p>
      </div>
    </div>

    <div class="stat-grid" id="stat-grid"></div>

    <div class="dash-grid">
      <section class="card">
        <div class="section__head">
          <h2 class="section__title">Project Progress</h2>
          <a href="projects.html" class="section__link">View all &rarr;</a>
        </div>
        <div class="project-progress-list" id="project-progress"></div>
      </section>

      <section class="card">
        <div class="section__head">
          <h2 class="section__title">Upcoming Deadlines</h2>
          <a href="calendar.html" class="section__link">Calendar &rarr;</a>
        </div>
        <div class="deadline-list" id="deadline-list"></div>
      </section>
    </div>

    <div class="dash-grid-2col">
      <section class="card">
        <div class="section__head">
          <h2 class="section__title">Recent Tasks</h2>
          <a href="tasks.html" class="section__link">All tasks &rarr;</a>
        </div>
        <div class="deadline-list" id="recent-tasks"></div>
      </section>

      <section class="card">
        <div class="section__head">
          <h2 class="section__title">Team Activity</h2>
          <a href="team.html" class="section__link">Team &rarr;</a>
        </div>
        <div class="activity-list" id="activity-list"></div>
      </section>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
