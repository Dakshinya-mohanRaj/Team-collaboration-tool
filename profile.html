<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TASKFLOW — Profile" />
  <title>Profile · TASKFLOW</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="view">
    <div class="content-head">
      <div>
        <h1 class="content-head__title">Profile</h1>
        <p class="content-head__sub">Your personal information and stats.</p>
      </div>
    </div>

    <div class="card profile-head">
      <span class="avatar avatar--lg" id="profile-avatar" style="background:hsl(230,70%,45%)">—</span>
      <div id="profile-head-meta">
        <div class="name" id="profile-name">—</div>
        <div class="role" id="profile-role">—</div>
        <div class="dept" id="profile-dept">—</div>
      </div>
    </div>

    <section class="profile-stats">
      <div class="stat-card">
        <span class="stat-card__icon stat-card__icon--info">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </span>
        <div>
          <div class="stat-card__value" id="profile-total">0</div>
          <div class="stat-card__label">Total Tasks</div>
        </div>
      </div>
      <div class="stat-card">
        <span class="stat-card__icon stat-card__icon--success">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </span>
        <div>
          <div class="stat-card__value" id="profile-completed">0</div>
          <div class="stat-card__label">Completed</div>
        </div>
      </div>
      <div class="stat-card">
        <span class="stat-card__icon stat-card__icon--primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </span>
        <div>
          <div class="stat-card__value" id="profile-inprogress">0</div>
          <div class="stat-card__label">In Progress</div>
        </div>
      </div>
      <div class="stat-card">
        <span class="stat-card__icon stat-card__icon--danger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </span>
        <div>
          <div class="stat-card__value" id="profile-overdue">0</div>
          <div class="stat-card__label">Overdue</div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="section__head mb-4">
        <h2 class="section__title">Personal Information</h2>
        <button type="button" class="btn btn--secondary btn--sm" id="profile-edit-btn">Edit Profile</button>
      </div>
      <div class="profile-edit-grid" id="profile-info">
        <div class="member-detail__cell"><label>Full name</label><p id="pi-name">—</p></div>
        <div class="member-detail__cell"><label>Email</label><p id="pi-email">—</p></div>
        <div class="member-detail__cell"><label>Phone</label><p id="pi-phone">—</p></div>
        <div class="member-detail__cell"><label>Department</label><p id="pi-dept">—</p></div>
        <div class="member-detail__cell" style="grid-column:1/-1"><label>Bio</label><p id="pi-bio">—</p></div>
      </div>
    </section>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
