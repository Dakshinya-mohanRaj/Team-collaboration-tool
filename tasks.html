<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TASKFLOW — My Tasks" />
  <title>My Tasks · TASKFLOW</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="view">
    <div class="content-head">
      <div>
        <h1 class="content-head__title">My Tasks</h1>
        <p class="content-head__sub" id="tasks-sub">All tasks across your team.</p>
      </div>
      <button type="button" class="btn btn--primary" id="new-task-btn">+ New Task</button>
    </div>

    <div class="filter-bar" role="search" aria-label="Task filters">
      <input
        type="search"
        id="task-search"
        class="input"
        style="flex:1;min-width:180px"
        placeholder="Search tasks..."
        aria-label="Search tasks"
      />

      <select id="filter-status" class="select" aria-label="Filter by status">
        <option value="">All Statuses</option>
        <option>To Do</option>
        <option>In Progress</option>
        <option>Review</option>
        <option>Completed</option>
      </select>

      <select id="filter-priority" class="select" aria-label="Filter by priority">
        <option value="">All Priorities</option>
        <option>Low</option>
        <option>Medium</option>
        <option>High</option>
        <option>Critical</option>
      </select>

      <select id="filter-project" class="select" aria-label="Filter by project">
        <option value="">All Projects</option>
      </select>

      <select id="filter-member" class="select" aria-label="Filter by member">
        <option value="">All Members</option>
      </select>

      <select id="filter-due" class="select" aria-label="Filter by due date">
        <option value="">Any Due Date</option>
        <option>Overdue</option>
        <option>Due Soon</option>
        <option>Completed</option>
      </select>

      <button type="button" class="btn btn--ghost btn--sm" id="clear-filters">Clear Filters</button>
    </div>

    <p class="small muted" id="task-count"></p>

    <div class="task-grid" id="task-grid"></div>

    <div class="empty-state" id="task-empty" hidden>
      <div class="empty-state__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </div>
      <h3 id="task-empty-title">No tasks found</h3>
      <p id="task-empty-desc">Try adjusting your filters or create a new task.</p>
      <button type="button" class="btn btn--primary mt-3" id="empty-new-task">+ New Task</button>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/tasks.js"></script>
</body>
</html>
