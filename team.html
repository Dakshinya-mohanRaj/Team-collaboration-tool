<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TASKFLOW — Team" />
  <title>Team · TASKFLOW</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="view">
    <div class="content-head">
      <div>
        <h1 class="content-head__title">Team</h1>
        <p class="content-head__sub">People working across your projects.</p>
      </div>
      <button type="button" class="btn btn--primary" id="new-member-btn">+ Add Member</button>
    </div>

    <div class="filter-bar" role="search" aria-label="Member filters">
      <input
        type="search"
        id="member-search"
        class="input"
        style="flex:1;min-width:200px"
        placeholder="Search by name, role or department..."
        aria-label="Search team members"
      />
      <select id="member-role-filter" class="select" aria-label="Filter by role">
        <option value="">All Roles</option>
        <option>Project Manager</option>
        <option>Developer</option>
        <option>Designer</option>
        <option>Tester</option>
        <option>Team Member</option>
      </select>
    </div>

    <div class="team-grid" id="member-grid"></div>

    <div class="empty-state" id="member-empty" hidden>
      <p>No team members found.</p>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/team.js"></script>
</body>
</html>
