<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TASKFLOW — Team Collaboration & Task Management" />
  <title>TASKFLOW — Sign In</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="standalone-body">
  <div class="login-shell">
    <section class="login-hero" aria-labelledby="hero-title">
      <div class="login-hero__brand">
        <span class="login-hero__logo">TF</span>
        <span class="login-hero__title">TASKFLOW</span>
      </div>
      <div class="login-hero__quote">
        <h1 id="hero-title">Plan together.<br />Ship faster.</h1>
        <p>
          One workspace for your projects, tasks, deadlines and team —
          built for teams that move quickly.
        </p>
      </div>
      <p class="login-hero__foot small">Team Collaboration &amp; Task Management</p>
    </section>

    <section class="login-form-side" aria-label="Login">
      <div class="login-card">
        <div class="login-card__head">
          <h2>Welcome back</h2>
          <p>Sign in to continue to TASKFLOW.</p>
        </div>

        <div class="login-error" id="login-error" role="alert"></div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="login-email">Email</label>
            <input
              type="email"
              id="login-email"
              class="input"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input
              type="password"
              id="login-password"
              class="input"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
          </div>
          <button type="submit" class="btn btn--primary btn--block mt-3">Login</button>
        </form>

        <div class="login-divider">or</div>

        <button type="button" id="login-demo" class="btn btn--secondary btn--block">
          Continue as Demo User — Dakshinya
        </button>

        <div class="login-note">
          <strong>Demo credentials</strong><br />
          Email: <code>dakshinya@example.com</code> &nbsp;•&nbsp; Password: <code>demo123</code>
        </div>
      </div>
    </section>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      "use strict";

      App.init("login");

      var errorBox = document.getElementById("login-error");
      var form = document.getElementById("login-form");
      var demoBtn = document.getElementById("login-demo");

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.add("is-visible");
      }

      function clearError() {
        errorBox.textContent = "";
        errorBox.classList.remove("is-visible");
      }

      function go(url) {
        window.location.href = url;
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        clearError();
        var email = document.getElementById("login-email").value.trim();
        var password = document.getElementById("login-password").value;

        if (!email || !password) {
          showError("Please enter your email and password.");
          return;
        }
        if (!email.includes("@")) {
          showError("Please enter a valid email address.");
          return;
        }

        App.login(email, password).then(function (result) {
          if (result.ok) {
            Utils.toast("Welcome back, " + result.user.name + "!", "success");
            setTimeout(function () {
              go("dashboard.html");
            }, 400);
          } else {
            showError(result.error);
          }
        });
      });

      demoBtn.addEventListener("click", function () {
        clearError();
        App.loginDemoNamed().then(function (user) {
          if (user) {
            Utils.toast("Signed in as " + user.name, "success");
            setTimeout(function () {
              go("dashboard.html");
            }, 400);
          } else {
            showError("Demo data could not be loaded.");
          }
        });
      });
    })();
  </script>
</body>
</html>
