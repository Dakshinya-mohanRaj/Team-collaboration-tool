<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TASKFLOW — Calendar" />
  <title>Calendar · TASKFLOW</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="view">
    <div class="content-head">
      <div>
        <h1 class="content-head__title">Calendar</h1>
        <p class="content-head__sub">Track task deadlines by date.</p>
      </div>
    </div>

    <div class="cal-shell">
      <section class="card">
        <div class="cal-head">
          <h2 class="cal-head__title" id="cal-title">—</h2>
          <div class="cal-head__nav">
            <button type="button" class="btn btn--ghost btn--sm" id="cal-today">Today</button>
            <button type="button" class="icon-btn" id="cal-prev" aria-label="Previous month">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <button type="button" class="icon-btn" id="cal-next" aria-label="Next month">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
        </div>
        <div class="cal-grid" id="cal-grid" role="grid" aria-label="Calendar"></div>
      </section>

      <section class="cal-day-detail">
        <div class="card">
          <div class="cal-detail-head">
            <h3 class="cal-detail-title" id="cal-detail-title">Tasks due today</h3>
            <span class="pill" id="cal-detail-date"></span>
          </div>
          <div class="deadline-list" id="cal-detail-list">
            <p class="muted small">Select a date to see its tasks.</p>
          </div>
        </div>

        <div class="card">
          <h3 class="card__title mb-3">Legend</h3>
          <div class="flex wrap gap-3">
            <span class="pill"><span class="cal-dot" style="width:12px;height:12px">1</span> Has tasks</span>
            <span class="pill"><span class="cal-dot cal-dot--overdue" style="width:12px;height:12px">1</span> Overdue</span>
            <span class="pill"><span class="cal-dot cal-dot--due" style="width:12px;height:12px">1</span> Due</span>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>
